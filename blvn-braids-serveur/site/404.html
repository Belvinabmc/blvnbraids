/* Créneaux du jour choisi */
function ensureSlots(date, duration) {
  const key = date + '|' + (duration || '');
  if (LIVE.av[key] || LIVE.loading[key]) return LIVE.av[key];
  LIVE.loading[key] = true;
  fetch(API('availability') + '?date=' + encodeURIComponent(date) + '&duration=' + (duration || '')).then(r => r.json()).then(j => { LIVE.av[key] = j; }).catch(() => { LIVE.av[key] = { slots: [], closed: false, error: true }; }).finally(() => { delete LIVE.loading[key]; render(); });
  return null;
}
function liveSlotsHtml(b, v) {
  const d = v && v.d != null ? v.d : null, j = ensureSlots(b.date, d);
  if (!j) return '<p class="muted" role="status">Recherche des créneaux…</p>';
  if (j.error) return '<p class="muted">Créneaux indisponibles pour le moment. Réessayez.</p>';
  if (j.closed) return '<p class="muted">Fermé ce jour-là. Choisissez un autre jour.</p>';
  if (!j.slots.length) return '<p class="muted">Plus de créneau ce jour-là. Choisissez un autre jour.</p>';
  return `<div class="slots">${j.slots.map(o => `<button class="slot ${o.available ? '' : 'full'}" aria-pressed="${b.slot === o.time}" ${o.available ? `data-act="slot" data-t="${o.time}"` : 'disabled'}>${o.time}${o.available ? '' : '<small>Complet</small>'}</button>`).join('')}</div>${j.approxDuration ? '<p class="muted" style="margin-top:8px">La durée exacte sera confirmée par la coiffeuse.</p>' : ''}`;
}

async function liveSubmit() {
  if (LIVE.busy) return; LIVE.busy = true; render();
  const b = S.b, s = svc(), v = vnt();
  b.key = b.key || (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  const payload = { serviceId: s.id, variantId: v.id, date: b.date, time: b.slot, key: b.key, rulesAccepted: !!b.rules, cancellationAccepted: !!b.cancel,
    contact: { name: b.name.trim(), email: b.email.trim(), phone: b.phone.trim(), note: b.note.trim() },
    answers: { size: b.size, length: b.length, lengthOther: b.lengthOther, own: !!b.own, hairType: b.hairType, bundles: b.bundles, sel: b.sel, home: !!b.home, postcode: b.cp, address: b.addr || b.cp } };
  try {
    const r = await fetch(API('book'), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json();
    if (!r.ok) { S.toast = j.error || 'Réservation impossible'; if (r.status === 409) { b.slot = null; S.step = 4; LIVE.av = {}; } }
    else if (j.kind === 'pay') { sessionStorage.setItem('blvn-pending', JSON.stringify({ label: `${s.name} · ${v.l}`, email: b.email.trim() })); location.href = j.url; return; }
    else if (j.kind === 'request') { S.done = { kind: 'request', svc: j.label, when: j.when, email: j.email }; S.b = freshB(); S.step = 1; }
    else if (j.kind === 'paid') { S.toast = 'Cette réservation est déjà confirmée.'; S.b = freshB(); S.step = 1; }
  } catch (e) { S.toast = 'Connexion impossible. Vérifiez votre réseau et réessayez.'; }
  LIVE.busy = false; render();
}
/* Retour de paiement */
async function liveReturn() {
  const u = new URL(location.href), sid = u.searchParams.get('paid'), cancelled = u.searchParams.get('cancelled');
  if (!sid && !cancelled) return;
  history.replaceState(null, '', u.pathname);
  if (cancelled) { S.toast = 'Paiement annulé. Le créneau sera libéré dans quelques minutes.'; S.view = 'book'; render(); return; }
  S.view = 'book'; S.done = { kind: 'checking' }; render();
  try {
    const r = await fetch(API('booking-status') + '?session=' + encodeURIComponent(sid)); const j = await r.json();
    if (r.ok && j.status === 'confirmed') { S.done = { kind: 'booking', svc: j.label, when: j.when, deposit: c2e(j.deposit), balance: c2e(j.balance), email: j.email, pts: Math.round(j.total / 100) }; }
    else S.done = { kind: 'pending', email: j.email };
  } catch (e) { S.done = { kind: 'pending' }; }
  render();
}

      <label class="fl" for="la-rc">Commentaire</label><textarea id="la-rc" rows="3" maxlength="600"></textarea>
      <button class="btn" style="margin-top:12px" data-act="la_radd">Publier cet avis</button></div>
      ${R.length ? R.map(r => `<div class="card"><div class="row"><b>${esc(r.author)}</b><span class="badge ${r.status === 'published' ? 'ok' : ''}">${ST[r.status] || r.status}</span></div><span class="stars" aria-label="${r.rating} sur 5">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span><p style="margin:6px 0 10px">${esc(r.comment)}</p>
        <input id="la-rr-${r.id}" type="text" maxlength="400" placeholder="Votre réponse publique (facultatif)" value="${esc(r.admin_reply || '')}">
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:flex-start">${r.status !== 'published' ? `<button class="btn small" data-act="la_rstatus" data-id="${r.id}" data-s="published">Publier</button>` : `<button class="btn small ghost" data-act="la_rstatus" data-id="${r.id}" data-s="hidden">Masquer</button>`}<button class="btn small ghost" data-act="la_rreply" data-id="${r.id}">Enregistrer la réponse</button><button class="btn small ghost" data-act="la_rdel" data-id="${r.id}">${S.delArm === 'lr:' + r.id ? 'Confirmer la suppression' : 'Supprimer'}</button></div></div>`).join('') : '<p class="muted">Aucun avis pour l’instant.</p>'}`; }
  return `<h2>Administration</h2><div class="row" style="gap:8px;margin-bottom:6px"><button class="btn ghost small" style="flex:1" data-act="pvstart">Prévisualiser comme cliente</button><button class="btn ghost small" data-act="la_refresh" aria-label="Actualiser">↻</button><button class="btn ghost small" data-act="la_logout">Déconnexion</button></div>
  <div class="seg" role="tablist" aria-label="Sections">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${LIVE.tab === k}" data-act="la_tab" data-k="${k}">${l}</button>`).join('')}</div>${body}`;
}
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
Object.assign(ACT, {
  la_login() { const p = val('la-pwd'); if (!p) return 'stop'; LIVE.token = p; try { localStorage.setItem(ADMIN_TOKEN_KEY, p); } catch (e) {} LIVE.msg = ''; liveAdminLoad(); return 'keep'; },
  la_logout() { LIVE.token = null; LIVE.data = null; try { localStorage.removeItem(ADMIN_TOKEN_KEY); } catch (e) {} S.view = 'home'; return 'keep'; },
  la_refresh() { liveAdminLoad(); return 'keep'; },
  la_tab(el) { LIVE.tab = el.dataset.k; S.delArm = ''; return 'keep'; },
  la_answer(el) { const id = el.dataset.id, price = val('la-p-' + id), duration = val('la-d-' + id); if (!(+price >= 0) || price === '' || !(+duration > 0)) { S.toast = 'Indiquez le tarif et la durée'; return 'keep'; } liveAdminPost({ action: 'answer', id, price, duration, message: val('la-m-' + id) }, 'Tarif envoyé à la cliente'); return 'stop'; },
  la_close(el) { liveAdminPost({ action: 'close', id: el.dataset.id }, 'Demande close'); return 'stop'; },
  la_cancel(el) { const k = 'la:' + el.dataset.id; if (S.delArm !== k) { S.delArm = k; return 'keep'; } S.delArm = ''; liveAdminPost({ action: 'cancel', id: el.dataset.id }, 'Rendez-vous annulé, cliente prévenue'); return 'stop'; },
  la_complete(el) { liveAdminPost({ action: 'complete', id: el.dataset.id }, 'Rendez-vous terminé'); return 'stop'; },
  la_variant(el) { const id = el.dataset.id; liveAdminPost({ action: 'variant', id, price: val('la-vp-' + id), duration: val('la-vd-' + id), refSize: val('la-vs-' + id), refLen: val('la-vl-' + id) }, 'Modèle enregistré'); return 'stop'; },
  la_hours() { const hours = []; for (let w = 1; w <= 7; w++) { const s = val('la-hs-' + w), e = val('la-he-' + w); if (s && e) hours.push({ weekday: w, starts: s, ends: e }); } liveAdminPost({ action: 'hours', hours }, 'Horaires enregistrés'); return 'stop'; },
  la_gadd(el) { const fs = [...((document.getElementById('la-gf') || {}).files || [])], title = val('la-gt').trim(), category = val('la-gc'), description = val('la-gd').trim();
    if (!title) { flash('Donnez un titre'); return 'stop'; } if (!fs.length) { flash('Choisissez au moins une photo'); return 'stop'; }
    el.disabled = true; el.textContent = 'Envoi en cours…';
    (async () => { let ok = 0, errMsg = '';
      for (const f of fs) { try { const r = await shrink(f, 1200); const res = await fetch(API('admin'), { method: 'POST', headers: hdrs(), body: JSON.stringify({ action: 'gallery_add', title, category, description, image: r.url }) }); if (res.ok) ok++; else errMsg = ((await res.json().catch(() => ({}))).error) || 'Une photo a été refusée'; } catch (e) { errMsg = 'Une photo n’a pas pu être lue'; } }
      S.toast = ok ? (ok > 1 ? ok + ' photos ajoutées à la galerie' : 'Photo ajoutée à la galerie') + (errMsg ? ' · ' + errMsg : '') : (errMsg || 'Envoi impossible');
      await liveAdminLoad(); loadSite(); })();
    return 'stop'; },
  la_gdel(el) { const k = 'lg:' + el.dataset.id; if (S.delArm !== k) { S.delArm = k; return 'keep'; } S.delArm = ''; liveAdminPost({ action: 'gallery_delete', id: el.dataset.id }, 'Photo supprimée'); return 'stop'; },
  la_radd() { const author = val('la-ra').trim(), comment = val('la-rc').trim(); if (!author || !comment) { flash('Indiquez le prénom et le commentaire'); return 'stop'; } liveAdminPost({ action: 'review_add', author, comment, rating: val('la-rn') }, 'Avis publié'); return 'stop'; },
  la_rstatus(el) { liveAdminPost({ action: 'review_status', id: el.dataset.id, status: el.dataset.s }, el.dataset.s === 'published' ? 'Avis publié' : 'Avis masqué'); return 'stop'; },
  la_rreply(el) { liveAdminPost({ action: 'review_reply', id: el.dataset.id, reply: val('la-rr-' + el.dataset.id) }, 'Réponse enregistrée'); return 'stop'; },
  la_rdel(el) { const k = 'lr:' + el.dataset.id; if (S.delArm !== k) { S.delArm = k; return 'keep'; } S.delArm = ''; liveAdminPost({ action: 'review_delete', id: el.dataset.id }, 'Avis supprimé'); return 'stop'; },
  la_timeoff() { const d = val('la-off'); if (!d) { S.toast = 'Choisissez un jour'; return 'keep'; } liveAdminPost({ action: 'timeoff', date: d }, 'Journée bloquée'); return 'stop'; },
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if((el.tagName==='INPUT'||el.tagName==='SELECT')&&INPUT_ACTS.has(el.dataset.act)) return;
  const f=ACT[el.dataset.act]; if(!f) return;
  const r=f(el,e); if(r==='stop') return;
  render(); if(r!=='keep') window.scrollTo(0,0);
});

/* Saisie : pas de rendu complet pour ne pas perdre le focus */
function refocus(id,pos){const i=$('#'+id);if(i){i.focus();if(i.setSelectionRange)try{i.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener('input',e=>{
  const t=e.target, a=t.dataset.act;
  if(t.dataset.sf!==undefined){ if(S.sheet){S.sheet.f[t.dataset.sf]=t.value; if(S.sheet.err&&S.sheet.err[t.dataset.sf]){delete S.sheet.err[t.dataset.sf]; const p=t.closest('.fwrap')&&t.closest('.fwrap').parentNode.querySelector('.err'); if(p)p.remove();} } return }
  if(t.dataset.sk){ if(S.sheet)S.sheet.f[t.dataset.sk][t.dataset.si]=t.value; return }
  if(t.dataset.gtext){S.b.sel[t.dataset.gtext]=t.value;updateNext();return}
  if(t.dataset.gnum){S.b.sel[t.dataset.gnum]=t.value;updateNext();return}
  if(t.dataset.field){S.b[t.dataset.field]=t.value;updateNext();return}
  if(t.dataset.aifield){S.ai[t.dataset.aifield]=t.value;const sb=document.querySelector('[data-act="aiSend"]');if(sb)sb.disabled=!aiFormOk();return}
  if(t.dataset.wfield){S.wl[t.dataset.wfield]=t.value;const wb=document.querySelector('[data-act="wjoin"]');if(wb)wb.disabled=!wlOk();return}
  if(a==='cp'){S.b.cp=t.value.replace(/\D/g,'');const pos=t.selectionStart;render();refocus('cp',pos)}
  if(a==='addr'){S.b.addr=t.value;updateNext();return}
  if(a==='lenother'){S.b.lengthOther=t.value;const pos=t.selectionStart;render();refocus('lo',pos)}
  if(a==='bundles'){S.b.bundles=t.value;updateNext()}
  if(a==='gqty'){const m=S.b.sel[t.dataset.g]||(S.b.sel[t.dataset.g]={});m[t.dataset.id]=Math.max(0,Math.round(+t.value||0));updateNext()}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.tagName==='SELECT'&&t.dataset.sf!==undefined&&S.sheet){S.sheet.f[t.dataset.sf]=t.value;if(t.dataset.sf==='condG')S.sheet.f.condV='';S.sheet.err={};render();return}
  if(t.id==='aiFile'&&t.files[0]){
    try{const r=await shrink(t.files[0]);S.ai.img=r.url;S.ai.blob=r.blob;S.ai.res=null;S.ai.err='';S.ai.sent=false;S.ai.manual=false;S.ai.key=null;render();}
    catch(_){S.toast='Image illisible';render();}
    return;
  }
  if(t.id==='gphFile'&&t.files[0]){
    try{const r=await shrink(t.files[0],900);if(S.gphTarget){S.b.sel[S.gphTarget]=r.url;}render();}catch(_){S.toast='Image illisible';render();}
    t.value='';return;
  }
  if(t.id==='impFile'&&t.files[0]){
    try{const txt=await t.files[0].text();if(S.sheet&&S.sheet.t==='import'){S.sheet.f.text=txt;S.sheet.err={};}render();}catch(_){S.toast='Fichier illisible';render();}
    t.value='';return;
  }
  if(t.id==='galFile'&&t.files.length){
    const sh=S.sheet; if(!sh||sh.t!=='gal'){t.value='';return}
    sh.busy=true;render();
    for(const file of [...t.files]){
      try{
        if(file.type.startsWith('video/')){
          if(file.size>80*1024*1024){S.toast='Vidéo trop lourde pour l’aperçu (80 Mo maximum)';continue}
          const src=URL.createObjectURL(file); const poster=await videoPoster(src);
          sh.f.media.push({id:uid(),type:'video',src,poster,name:file.name});
        } else if(file.type.startsWith('image/')){
          const r=await shrink(file,1100); sh.f.media.push({id:uid(),type:'photo',src:r.url,name:file.name});
        }
      }catch(_){ S.toast='Un fichier n’a pas pu être lu'; }
    }
    sh.busy=false; sh.err={}; t.value=''; render(); return;
  }
  if(t.id==='phFile'&&t.files[0]){
    try{const r=await shrink(t.files[0],900);
      if(S.phTarget==='sheet'&&S.sheet){S.sheet.f.photo=r.url;}
      else if(S.phTarget&&S.phTarget!=='sheet'){S.phTarget.photo=r.url;S.toast='Photo ajoutée';}
      render();}
    catch(_){S.toast='Image illisible';render();}
    t.value='';return;
  }
});
runIntro();
initGL();
render();
if(SITE_MODE){ S.ai.can=true; S.gallery=[]; S.reviews=[]; if(ADMIN_ENTRY) S.view='admin'; loadCatalog().then(liveReturn); loadSite(); }
(async()=>{ try{ const dl=await claude.use('downloads'); if(dl) S.dl=dl; }catch(_){}
  try{ const sm=await claude.use('sample'); if(sm){ const l=await sm.limits(); S.ai.can=!!(l&&l.images); } }catch(_){} if(S.view==='home')render(); })();

</script>
