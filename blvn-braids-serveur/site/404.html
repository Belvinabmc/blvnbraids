:root{
  --coral:#FF5A5F; --ink:#1A1A1A; --paper:#FAFAFA; --soft:rgba(26,26,26,.1);
  --script:'Mrs Saint Delafield','Snell Roundhand','Brush Script MT',cursive;
  --serif:'Bodoni Moda','Didot','Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--coral:#E84A50}}
:root[data-theme="dark"]{--coral:#E84A50}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--coral);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{max-width:480px;margin:0 auto;min-height:100vh;padding:0 22px 100px}
.mini{padding:22px 0 4px;text-align:center}
.mini .w{font-family:var(--script);font-size:54px;line-height:.9;margin:0}
.mini .t{font-size:11px;letter-spacing:.5em;text-transform:uppercase;font-weight:400;margin:2px 0 0;padding-left:.5em}
.hero{text-align:center;padding:30px 0 6px}
.hero img{width:min(78%,300px);height:auto;display:block;margin:0 auto 22px}
.hero p{max-width:30ch;margin:0 auto 20px;font-size:17px}
h2{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-.01em;margin:34px 0 10px;line-height:1.15}
h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:21px;margin:22px 0 4px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
h4{font-size:15px;font-weight:600;margin:0 0 6px}
p{margin:0 0 12px}
.muted{opacity:.74;font-size:14px}
.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:20px;padding:18px;margin:14px 0}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.btn{font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:13px 22px;font-weight:500;letter-spacing:.05em;width:100%;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink)}
.card .btn.ghost{background:var(--paper)}
.btn.small{width:auto;padding:8px 16px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* lignes de tarifs façon carte */
.mrow{display:flex;align-items:flex-end;gap:8px;width:100%;background:none;border:0;color:var(--ink);font:inherit;text-align:left;padding:11px 0;cursor:pointer;min-height:48px}
.mrow .ml{flex:0 1 auto;max-width:66%;line-height:1.3}
.mrow .lead{flex:1;min-width:14px;border-bottom:1.5px dotted rgba(26,26,26,.55);margin-bottom:7px}
.pill{flex:none;background:var(--paper);border-radius:999px;padding:3px 14px;font-weight:600;font-size:15px;min-width:64px;text-align:center;align-self:center}
.mrow[aria-pressed="true"] .ml{font-weight:600}
.mrow[aria-pressed="true"] .pill{background:var(--ink);color:var(--paper)}
.mrow[disabled]{cursor:default}
.mrow[disabled] .pill{background:transparent;border:1.5px dashed var(--ink);font-weight:400;font-size:13px}
.group{margin-bottom:8px}
.steps{display:flex;gap:6px;margin:18px 0 0}
.steps i{flex:1;height:3px;border-radius:3px;background:var(--soft)}
.steps i.on{background:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1.5px solid var(--ink);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:480px}
nav.tabs button{flex:1;background:none;border:0;color:var(--ink);padding:10px 2px 8px;font:inherit;font-size:11px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;opacity:.6;cursor:pointer}
nav.tabs button[aria-current="page"]{opacity:1;font-weight:600}
nav.tabs svg{width:22px;height:22px}
label.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--soft);cursor:pointer}
label.opt:last-child{border:0;padding-bottom:0}
input[type=checkbox],input[type=radio]{accent-color:var(--ink);width:20px;height:20px;margin-top:2px;flex:none}
input[type=text],input[type=number],textarea{width:100%;font:inherit;border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink)}
.qty{width:76px!important;flex:none;text-align:center}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.day{flex:none;width:58px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 0;text-align:center;font:inherit;font-size:12px;cursor:pointer}
.day b{display:block;font-size:20px;font-weight:500}
.day[aria-pressed="true"],.slot[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.slot{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 0;font:inherit;font-size:14px;cursor:pointer}
.slot[disabled]{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.sum{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:15px}
.sum.total{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:600}
.badge{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;background:var(--paper);white-space:nowrap}
.badge.ok{background:var(--ink);color:var(--paper)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{margin:0}
.arch{aspect-ratio:3/4;border:1.5px solid var(--ink);border-radius:999px 999px 14px 14px;background:var(--paper);display:grid;place-items:center;position:relative;overflow:hidden}
.arch span{font-family:var(--script);font-size:44px;line-height:1}
.tile figcaption{padding:8px 4px 0;font-size:14px}
.tile .btn{margin-top:6px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.stamp{aspect-ratio:1;border:1.5px dashed var(--ink);border-radius:50%;display:grid;place-items:center;font-size:13px}
.stamp.on{border-style:solid;background:var(--ink);color:var(--paper)}
.stars{letter-spacing:2px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:9;white-space:nowrap}
.preview{width:100%;max-height:240px;object-fit:cover;border-radius:14px;border:1.5px solid var(--ink);margin:10px 0}
.switch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.switch:last-child{border:0}
details{border-top:1px solid var(--soft);padding:8px 0}
summary{cursor:pointer;font-weight:500;min-height:36px;display:flex;align-items:center}
.edit{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:5px 0;font-size:14px}
.edit input{width:84px;text-align:right}
.foot{text-align:center;font-size:12px;letter-spacing:.3em;margin-top:40px;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select.sel{font:inherit;padding:8px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);max-width:55%}
.fl{display:block;font-size:14px;margin:12px 0 4px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1.5px solid var(--ink);flex:none}
.chip small{opacity:.8}
.mrow .ml small{opacity:.7;font-size:13px}
.ok-msg{border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--paper)}
.mwrap{display:flex;gap:10px;align-items:center}
.mwrap .mrow{flex:1;min-width:0}
.mph{background:none;border:0;padding:0;cursor:zoom-in;flex:none;display:block}
.mthumb{width:52px;height:52px;object-fit:cover;border-radius:12px;border:1.5px solid var(--ink);display:block}
.cover{width:100%;max-height:230px;object-fit:cover;border-radius:18px;border:1.5px solid var(--ink);margin:6px 0 4px;display:block}
.cthumb{width:26px;height:26px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:6px}
.lightbox{position:fixed;inset:0;background:rgba(26,26,26,.88);display:grid;place-items:center;z-index:20;padding:20px}
.lightbox img{max-width:100%;max-height:80vh;border-radius:16px;border:1.5px solid var(--paper)}
.dur{display:flex;align-items:center;gap:6px;font-size:14px}
.dur input,.edit .dur input{width:60px;text-align:center;padding:9px 6px}
.phrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.arow{padding:12px 0;border-bottom:1px solid var(--soft)}
.arow2{padding:10px 12px;margin:10px 0;border:1px solid var(--soft);border-radius:14px}
.slot.full{border-style:dashed;opacity:.8}
.slot.full small{display:block;font-size:10px;letter-spacing:.04em}
.chip small{opacity:.8}
select.sel{font:inherit;padding:8px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);max-width:55%}

/* --- v6 : administration guidée + corrections de largeur --- */
html,body{max-width:100%;overflow-x:hidden}
input,select,textarea{min-width:0;max-width:100%}
.row>*,.edit>*{min-width:0}
.seg{display:flex;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px;margin:14px 0 18px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 2px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;min-height:42px;min-width:0}
.seg button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.seg .badge{padding:0 7px;font-size:11px;background:var(--coral);color:var(--ink);border-color:var(--coral)}
.lrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--soft);padding:12px 0;color:var(--ink);font:inherit;min-height:60px;cursor:pointer}
.lrow:last-of-type{border-bottom:0}
.lrow .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .lt small{opacity:.72;font-size:13px}
.chev{font-size:24px;opacity:.45;flex:none}
.avatar{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--serif);font-size:20px;flex:none;background:var(--paper)}
.swt{display:flex;gap:8px;align-items:center;font-size:13px}
.okc{border-style:solid}
.check{list-style:none;margin:0 0 14px;padding:0}
.check li{display:flex;gap:12px;align-items:center;padding:8px 0}
.tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13px;flex:none}
.check li.done .tick{background:var(--ink);color:var(--paper)}
.choice{border:1px solid var(--soft);border-radius:14px;padding:10px 12px;margin:12px 0}
.sheet-back{position:fixed;inset:0;background:rgba(26,26,26,.55);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--paper);border:1.5px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;z-index:31;padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sh-head h2{font-size:26px;margin:4px 0 8px}
.x{border:1.5px solid var(--ink);background:none;border-radius:50%;width:40px;height:40px;font-size:22px;line-height:1;color:var(--ink);cursor:pointer;flex:none}
.foot-actions{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--paper);padding:12px 0 4px}
.fwrap{position:relative}
.fwrap .sfx{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.hint{font-size:13px;opacity:.72;margin:4px 0 0}
.err{font-size:13px;font-weight:500;margin:6px 0 0}
.kinds{display:grid;gap:10px;margin-top:6px}
.kind{text-align:left;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:56px}
.kind[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.kind small{opacity:.75}
.dur.big input{width:76px;padding:12px 8px}
.qd{margin-top:10px}
.qd .chip{min-height:36px;padding:6px 12px;font-size:13px}

/* --- v8 : animation et 3D --- */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .7s ease}
.shell{position:relative;z-index:1}
#intro{position:fixed;inset:0;z-index:100;background:var(--coral);display:grid;place-items:center;transition:opacity .8s ease,transform .9s cubic-bezier(.7,0,.2,1),visibility .9s}
#intro img{width:min(70vw,300px);height:auto;animation:introLogo 1.3s cubic-bezier(.2,.8,.2,1) both}
#intro.out{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}
@keyframes introLogo{from{opacity:0;transform:translateY(14px) scale(.94);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* transitions d’écran */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes riseL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes riseR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
#app.enter>*:not(.rv){animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#app.enter.back>*:not(.rv){animation-name:riseL}
#app.enter>*:nth-child(2){animation-delay:.06s}#app.enter>*:nth-child(3){animation-delay:.12s}#app.enter>*:nth-child(4){animation-delay:.18s}
#app.enter>*:nth-child(5){animation-delay:.24s}#app.enter>*:nth-child(n+6){animation-delay:.3s}
body.first #app.enter>*:not(.rv){animation-delay:1.6s}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* hero */
.hero{min-height:calc(100svh - 170px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0 18px;text-align:center}
.hero-logo{perspective:800px;will-change:transform;margin-bottom:6px}
.hero .logo3d{width:min(80vw,320px);height:auto;display:block;margin:0 auto;animation:floaty 7s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(-7px) rotateX(2deg) rotateY(-3deg)}to{transform:translateY(8px) rotateX(-2deg) rotateY(3deg)}}
.hero-p{max-width:30ch;margin:6px auto 20px;font-size:17px}
.hero .cta{max-width:320px}
.scroll-hint{margin-top:26px;background:none;border:0;font:inherit;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 12px 8px calc(12px + .42em)}
.scroll-hint span{font-size:18px;letter-spacing:0;animation:bob 1.7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* carrousel 3D des prestations */
.cf{--cw:min(62vw,240px);display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;perspective:1000px;padding:26px 0 84px;margin:0 -22px -44px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cf::-webkit-scrollbar{display:none}
.cf-pad{flex:none;width:calc(50% - var(--cw)/2 - 16px)}
.cf-card{flex:none;width:var(--cw);scroll-snap-align:center;background:var(--paper);border:1.5px solid var(--ink);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transform-style:preserve-3d;will-change:transform,opacity;box-shadow:0 20px 26px -16px rgba(26,26,26,.34);transition:box-shadow .3s}
.cf-card.on{box-shadow:0 26px 34px -16px rgba(26,26,26,.46)}
.cf-arch{aspect-ratio:3/4;border-radius:999px 999px 12px 12px;border:1.5px solid var(--ink);display:grid;place-items:center;overflow:hidden;background:var(--coral);margin-bottom:4px}
.cf-arch img{width:100%;height:100%;object-fit:cover;display:block}
.cf-mono{font-family:var(--script);font-size:104px;line-height:1;padding-bottom:8px}
.cf-card b{font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:-.01em}
.cf-card small{opacity:.72;font-size:14px}

/* galerie : anneau 3D */
.ring{height:360px;perspective:1100px;touch-action:pan-y;cursor:grab;margin:6px -22px 10px;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.ring:active{cursor:grabbing}
.ring-in{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.ring-it{position:absolute;left:-76px;top:-132px;width:152px;background:none;border:0;padding:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:var(--ink);font:inherit;text-align:center;cursor:inherit}
.ring-it .arch{aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;box-shadow:0 18px 26px -12px rgba(26,26,26,.4)}
.ring-it .arch img{width:100%;height:100%;object-fit:cover;display:block}
.ring-it small{display:block;margin-top:8px;font-size:13px}

/* fidélité */
.lring{width:150px;height:150px;position:relative;margin:4px auto 6px}
.lring svg{width:100%;height:100%;display:block}
.lr-fill{stroke-dasharray:339.3;stroke-dashoffset:339.3;animation:ringfill 1.4s .25s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ringfill{to{stroke-dashoffset:var(--to)}}
.lr-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.lr-in b{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1}
.lr-in small{opacity:.7}
.stamp.on{animation:stampPop .6s cubic-bezier(.2,1.4,.3,1) both}
@keyframes stampPop{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}

/* confirmation */
.okmark{width:84px;height:84px;margin:8px auto 0}
.okmark svg{width:100%;height:100%;display:block}
.okmark circle{stroke-dasharray:151;stroke-dashoffset:151;animation:draw .9s .1s ease forwards}
.okmark path{stroke-dasharray:44;stroke-dashoffset:44;animation:draw .6s .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* fenêtres, messages, boutons */
#sh.anim .sheet{animation:sheetUp .42s cubic-bezier(.2,.8,.2,1)}
#sh.anim .sheet-back{animation:fadeIn .3s ease}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{animation:toastIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
.btn{transition:transform .18s ease,box-shadow .25s ease,background .2s ease,color .2s ease}
.btn:not([disabled]):hover{box-shadow:0 10px 22px -8px rgba(26,26,26,.35)}
.btn:not([disabled]):active{transform:scale(.97)}
.mrow,.lrow,.chip,.kind,.slot,.day{transition:background .2s ease,color .2s ease,transform .15s ease}
.mrow:active,.lrow:active,.chip:active,.slot:active,.day:active{transform:scale(.98)}
.steps i{transition:background .5s ease}
.card{transition:transform .25s ease,box-shadow .3s ease}
nav.tabs button{transition:opacity .25s ease}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1!important;transform:none!important}
  #gl{display:none}
  .lr-fill{stroke-dashoffset:var(--to)}
  .okmark circle,.okmark path{stroke-dashoffset:0}
}

/* --- v9 : aperçu cliente, organisation, galerie, choix conditionnels --- */
.pvbar{position:sticky;top:0;z-index:12;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--paper);padding:8px 12px;margin:0 -22px;font-size:13px;border-radius:0 0 14px 14px}
.pvbar .btn{background:var(--paper);color:var(--ink);border-color:var(--paper);min-height:34px;padding:6px 12px;font-size:13px}
.pvbar span{min-width:0}
.srow{display:flex;align-items:center;border-bottom:1px solid var(--soft)}
.srow:last-child{border-bottom:0}
.pv-on .shell{padding-top:0}
.srow .lrow{border-bottom:0;flex:1;min-width:0}
.mv{display:flex;flex-direction:column;gap:4px;flex:none}
.mvb{width:38px;height:30px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:10px;font:inherit;font-size:15px;cursor:pointer;line-height:1}
.mvb[disabled]{opacity:.3;cursor:default}
.mgrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.dlist{margin:6px 0 0;padding-left:18px;font-size:13px;opacity:.8}
.dlist li{margin:2px 0}
.gmedia{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.gm{position:relative;border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--coral);aspect-ratio:1}
.gm.cover{outline:3px solid var(--ink);outline-offset:2px}
.gm img{width:100%;height:100%;object-fit:cover;display:block}
.gmv{display:grid;place-items:center;height:100%;font-size:34px}
.gtype{position:absolute;top:6px;left:6px;background:var(--paper);border-radius:999px;font-size:11px;padding:1px 8px;border:1px solid var(--ink)}
.gmact{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:6px;background:linear-gradient(transparent,rgba(26,26,26,.55))}
.gmact .btn{min-height:32px;padding:4px 10px;font-size:12px}
.gmact .btn:first-child{flex:1}
.vbox{max-width:min(92vw,520px);width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--paper)}
.vbox img,.vbox video{max-width:100%;max-height:62vh;border-radius:16px;border:1.5px solid var(--paper);background:#000}
.vcap{align-self:stretch;font-size:14px}
.vcap p{margin:6px 0 0;opacity:.85}
.vcap .badge{color:var(--ink)}
.vnav{display:flex;align-items:center;gap:16px}
.vnav .btn.ghost{color:var(--paper);border-color:var(--paper)}
.vmiss{color:var(--paper);padding:30px 10px;text-align:center}
.card.cond-new{animation:condIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes condIn{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}

.demo-note{text-align:center;font-size:12px;opacity:.8;margin:6px 0 0;padding:0 22px}

</style>
</head>

</div>
<div id="lb"></div>
<div id="sh"></div>
<input type="file" id="phFile" accept="image/*" hidden>
<input type="file" id="gphFile" accept="image/*" hidden>

function answerIs(p,val){const a=S.b.sel[p.id]; if(p.kind==='yesno'||p.kind==='single') return a===val; if(p.kind==='multi') return !!(a&&+a[val]>0); return false;}

  if(g.hidden||!grpApplies(g,v)||d>8) return false;
  if(g.cond){ const p=s.groups.find(x=>x.id===g.cond.gid); if(!p||!grpVisible(s,p,v,d+1)||!answerIs(p,g.cond.v)) return false; }

}

const numOk=(g,a)=>{ if(a===undefined||a==='') return false; const n=Math.round(+a); return Number.isFinite(n)&&n>=(+g.min||0)&&(g.max===''||g.max==null||n<=+g.max); };

/* ---------- Prix ---------- */
function pricing(){
  const s=svc(), v=vnt(), b=S.b; if(!s||!v) return {lines:[],total:0,deposit:0,pending:false,dur:null};
  const lines=[[vname(s,v), v.p]]; let extra=0;
  /* grosseur / longueur : ce qui est compris dans le prix du modèle n’ajoute aucune ligne ; sans référence définie, le montant reste à confirmer */
  if(v.askSize && b.size){ const rf=v.refSize||s.refSize||null; if(b.size!==rf) lines.push(['Grosseur · '+lab(SIZES,b.size), rf?(s.sizeSupp[b.size]??null):null]); }
  if(v.askLen && b.length){ const rf=v.refLen||s.refLength||null; if(b.length!==rf) lines.push(['Longueur · '+(b.length==='other'?'autre ('+(b.lengthOther||'à préciser')+')':lab(LENGTHS,b.length)), (b.length==='other'||!rf)?null:(s.lengthSupp[b.length]??null)]); }
  if(s.hair && !b.own && b.hairType){
    const t=s.hair.types.find(x=>x.id===b.hairType);
    if(t){
      if(s.hair.perBundle){ const n=+b.bundles||0; lines.push([`Mèches ${t.l.toLowerCase()} (${n} bundle${n>1?'s':''})`, t.p==null?null:t.p*n]); }
      else lines.push([`Mèches ${t.l.toLowerCase()}`, t.p]);
      extra+=t.d||0;
    }
  }
  visGroups(s,v).forEach(g=>{
    const sel=b.sel[g.id];
    if(g.kind==='single'){ const x=itemsOf(g,v).find(i=>i.id===sel); if(x){ lines.push([`${g.l} · ${x.l}`, x.p]); extra+=x.d||0; } }
    else if(g.kind==='multi'){ const m=sel||{}; itemsOf(g,v).forEach(x=>{ const q=+m[x.id]||0; if(q>0){ lines.push([x.unit?`${x.l} (${q} ${x.unit})`:x.l, x.p==null?null:x.p*q]); extra+=(x.d||0)*q; } }); }
    else if(g.kind==='yesno'){ if(sel==='yes'&&g.price!=null) lines.push([`${g.l} · Oui`, g.price]); }
    else if(g.kind==='number'){ const q=Math.round(+sel||0); if(q>0&&g.price!=null) lines.push([`${g.l} (${q}${g.unit?' '+g.unit:''})`, g.price*q]); }
  });
  if(b.home){ const f=travelFee(b.cp); if(Number.isFinite(f)) lines.push(['Frais de déplacement', f]); }
  const known=lines.filter(l=>l[1]!=null).reduce((t,l)=>t+l[1],0);
  return {lines,total:known,deposit:Math.round(known*CFG.depositRate*100)/100,pending:lines.some(l=>l[1]==null)||(SITE_MODE&&v.d==null),dur:v.d==null?null:v.d+extra};
}
/* Résumé lisible des réponses de la cliente (pour la demande ou le rendez-vous) */
function choiceSummary(){
  const s=svc(), v=vnt(), b=S.b, out=[]; if(!s||!v) return out;
  visGroups(s,v).forEach(g=>{ const a=b.sel[g.id];
    if(g.kind==='single'){ const x=g.items.find(i=>i.id===a); if(x) out.push(`${g.l} : ${x.l}`); }
    else if(g.kind==='multi'){ const n=g.items.filter(x=>+(a||{})[x.id]>0).map(x=>{const q=+a[x.id];return x.unit?`${x.l} (${q} ${x.unit})`:x.l}); if(n.length) out.push(`${g.l} : ${n.join(', ')}`); }
    else if(g.kind==='yesno'){ if(a) out.push(`${g.l} : ${a==='yes'?'Oui':'Non'}`); }
    else if(g.kind==='text'){ if((a||'').trim()) out.push(`${g.l} : ${a.trim()}`); }
    else if(g.kind==='number'){ if(numOk(g,a)) out.push(`${g.l} : ${Math.round(+a)}${g.unit?' '+g.unit:''}`); }
    else if(g.kind==='photo'){ if(a) out.push(`${g.l} : photo jointe`); }
  });
  return out;
}

const hairOk=()=>{const s=svc(),b=S.b; return !s||!s.hair||b.own||(!!b.hairType&&(!s.hair.perBundle||+b.bundles>=1))};
const groupsOk=()=>{const s=svc(),v=vnt(),b=S.b; if(!s||!v) return true;

function shrink(file,max=1024){
  return new Promise((ok,ko)=>{
    const fr=new FileReader(); fr.onerror=ko;
    fr.onload=()=>{ const im=new Image(); im.onerror=ko; im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement('canvas');
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>ok({blob:b,url:c.toDataURL('image/jpeg',.85)}),'image/jpeg',.85); };
      im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

    <button class="scroll-hint" data-act="hint" aria-label="Découvrir les prestations">Découvrir<span aria-hidden="true">↓</span></button>
  </section>
  <h2 class="rv" id="svc">Nos prestations</h2>
  ${coverflow()}
  <h3 class="rv">Grille tarifaire</h3>
  <div class="rv">${menuRows()}</div>
  <p class="muted rv">Tarifs hors mèches. Le détail des modèles s’affiche à l’étape suivante.</p>
  <h2 class="rv">Un modèle en tête ?</h2>
  <div class="card rv">
    <p>Importez une photo d’inspiration : nous cherchons le modèle le plus proche dans la grille tarifaire.</p>
    <input type="file" id="aiFile" accept="image/*" hidden>
    <button class="btn ghost" data-act="aiPick">${a.img?'Changer de photo':'Importer une photo'}</button>
    ${a.img?`<img class="preview" src="${a.img}" alt="Photo d’inspiration importée">`:''}
    ${a.img&&a.can&&!a.busy&&!a.res&&!a.err&&!a.sent&&!a.manual?`<button class="btn" data-act="aiRun">Estimer le tarif</button>`:''}
    ${a.busy?'<p class="muted" role="status">Analyse de la photo…</p>':''}
    ${a.err&&!a.sent?`<p class="muted">${esc(a.err)}</p>`:''}
    ${a.res&&!a.res.none&&!a.sent?`
      <h3 style="margin-top:14px">${esc(vname(a.res.s,a.res.v))}</h3>
      <div class="sum"><span>Tarif (hors mèches)</span><b>${eur(a.res.v.p)}</b></div>
      <div class="sum"><span>Durée</span><b>${a.res.v.d?'≈ '+dur(a.res.v.d):'À confirmer par la coiffeuse'}</b></div>
      <p class="muted" style="margin-top:8px">${esc(a.res.why||'')} Estimation indicative, le tarif final tient compte de la grosseur, de la longueur et des mèches.</p>
      <button class="btn" data-act="aiBook">Réserver ce modèle</button>
      ${a.manual?'':'<button class="btn ghost small" style="margin-top:10px" data-act="aiManual">Ce n’est pas le bon modèle ?</button>'}`:''}
    ${a.res&&a.res.none&&!a.sent?`<p style="margin-top:12px">${a.res.style?`Nous reconnaissons : <b>${esc(a.res.style)}</b>. `:''}Ce modèle ne figure pas encore dans notre grille : demandez directement à la coiffeuse si elle le réalise.</p>`:''}
    ${a.sent?`<p class="ok-msg" style="margin-top:12px" role="status">Votre demande a bien été envoyée à la coiffeuse. Elle vérifiera le modèle et vous transmettra le tarif ainsi que la durée par e-mail ou par SMS avant votre réservation.</p>`:''}
    ${(waiting||(a.manual&&a.img&&!a.sent))?aiForm():''}
  </div>`;
}

function stepBar(){return `<div class="steps" role="img" aria-label="Étape ${S.step} sur 7">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<=S.step?'on':''}"></i>`).join('')}</div>`}
const pr=x=>x.p==null?'à définir':'+ '+eur(x.p)+(x.unit?' / '+x.unit.replace(/s$/,''):'');
const cthumb=x=>x.photo?`<img class="cthumb" src="${x.photo}" alt="">`:'';

function slBlock(){
  const v=vnt(), b=S.b; if(!v||!(v.askSize||v.askLen)) return '';
  let out='';
  if(v.askSize) out+=`<div class="card"><h4>Grosseur des tresses</h4><div class="chips" role="group" aria-label="Grosseur des tresses">${SIZES.map(([id,l])=>`<button class="chip" aria-pressed="${b.size===id}" data-act="size" data-id="${id}">${l}</button>`).join('')}</div></div>`;
  if(v.askLen) out+=`<div class="card"><h4>${v.askSize?'Longueur des tresses':'Longueur'}</h4><div class="chips" role="group" aria-label="Longueur">${LENGTHS.map(([id,l])=>`<button class="chip" aria-pressed="${b.length===id}" data-act="len" data-id="${id}">${l}</button>`).join('')}</div>
  ${b.length==='other'?`<label for="lo" class="muted" style="display:block;margin-top:12px">Précisez la longueur</label><input id="lo" type="text" value="${esc(b.lengthOther)}" data-act="lenother" placeholder="Ex. : juste au-dessus de la taille">`:''}</div>`;
  return out;
}
function hairBlock(){
  const s=svc(), b=S.b; if(!s||!s.hair) return '';
  const h=s.hair;
  return `<div class="card"><h4>Mèches</h4>
    <label class="opt"><input type="radio" name="own" ${b.own?'checked':''} data-act="own1"><span>J’apporte mes mèches</span></label>
    <label class="opt"><input type="radio" name="own" ${!b.own?'checked':''} data-act="own0"><span>Je souhaite que la coiffeuse fournisse les mèches</span></label>
    ${!b.own?`<p class="muted" style="margin:10px 0 6px">Type de mèches${h.perBundle?' (prix par bundle)':''}</p>
      <div class="chips" role="group" aria-label="Type de mèches">${h.types.map(t=>`<button class="chip" aria-pressed="${b.hairType===t.id}" data-act="htype" data-id="${t.id}">${esc(t.l)}<br><small>${t.p==null?'à définir':(h.perBundle?eur(t.p)+' / bundle':'+ '+eur(t.p))}</small></button>`).join('')}</div>
      ${h.perBundle?`<label class="fl" for="bundles">Nombre de bundles</label><input id="bundles" type="number" min="1" max="20" inputmode="numeric" value="${esc(b.bundles)}" data-act="bundles" style="max-width:140px">`:''}`:''}</div>`;
}
function groupBlock(g){
  const b=S.b, v=vnt();
  const cls='card'+((g.cond&&!S.condShown.has(g.id))?' cond-new':'');
  if(g.cond) S.condNow.add(g.id);
  const req=g.required?'':' <span class="muted">(facultatif)</span>';
  const head=`<h4>${esc(g.l)}${req}</h4>`;
  if(g.kind==='single'||g.kind==='multi'){
    const its=itemsOf(g,v); if(!its.length) return '';
    if(g.kind==='single') return `<div class="${cls}">${head}<div class="chips" role="group" aria-label="${esc(g.l)}">${its.map(x=>`<button class="chip" aria-pressed="${b.sel[g.id]===x.id}" data-act="gpick" data-g="${g.id}" data-id="${x.id}">${cthumb(x)}${esc(x.l)}<br><small>${pr(x)}</small></button>`).join('')}${g.required?'':`<button class="chip" aria-pressed="${!b.sel[g.id]}" data-act="gpick" data-g="${g.id}" data-id="">Aucun</button>`}</div></div>`;
    const m=b.sel[g.id]||{};
    return `<div class="${cls}">${head}${its.map(x=>x.unit
      ?`<div class="edit"><label for="gq-${x.id}">${cthumb(x)}${esc(x.l)}<br><small class="muted">${pr(x)}</small></label><input id="gq-${x.id}" class="qty" type="number" min="0" inputmode="numeric" value="${+m[x.id]||0}" data-act="gqty" data-g="${g.id}" data-id="${x.id}" aria-label="Nombre de ${esc(x.unit)}"></div>`
      :`<label class="opt"><input type="checkbox" ${+m[x.id]?'checked':''} data-act="gmulti" data-g="${g.id}" data-id="${x.id}"><span>${cthumb(x)}${esc(x.l)} <b>${pr(x)}</b></span></label>`).join('')}</div>`;
  }
  if(g.kind==='yesno'){
    const a=b.sel[g.id];
    return `<div class="${cls}">${head}<div class="chips" role="group" aria-label="${esc(g.l)}"><button class="chip" aria-pressed="${a==='yes'}" data-act="gyn" data-g="${g.id}" data-v="yes">Oui${g.price!=null?`<br><small>+ ${eur(g.price)}</small>`:''}</button><button class="chip" aria-pressed="${a==='no'}" data-act="gyn" data-g="${g.id}" data-v="no">Non</button></div></div>`;
  }
  if(g.kind==='text') return `<div class="${cls}">${head}<textarea id="gt-${g.id}" rows="3" maxlength="400" data-gtext="${g.id}" aria-label="${esc(g.l)}" placeholder="${esc(g.ph||'Votre réponse…')}">${esc(b.sel[g.id]||'')}</textarea></div>`;
  if(g.kind==='number') return `<div class="${cls}">${head}<div class="row" style="justify-content:flex-start"><input id="gn-${g.id}" type="number" inputmode="numeric" min="${esc(g.min||0)}" ${g.max!==''&&g.max!=null?`max="${esc(g.max)}"`:''} value="${esc(b.sel[g.id]==null?'':b.sel[g.id])}" data-gnum="${g.id}" aria-label="${esc(g.l)}" style="max-width:120px">${g.unit?`<span class="muted">${esc(g.unit)}</span>`:''}${g.price!=null?`<span class="muted">${eur(g.price)} l’unité</span>`:''}</div></div>`;
  if(g.kind==='photo'){ const a=b.sel[g.id];
    return `<div class="${cls}">${head}<div class="phrow">${a?`<img class="mthumb" src="${a}" alt="Photo jointe">`:'<span class="muted">Aucune photo</span>'}<button class="btn small ghost" data-act="gphoto" data-g="${g.id}">${a?'Changer la photo':'Ajouter une photo'}</button>${a?`<button class="btn small ghost" data-act="gphotodel" data-g="${g.id}">Retirer</button>`:''}</div></div>`; }
  return '';
}

function book(){
  if(S.done) return confirmation();
  const b=S.b, s=svc(), v=vnt();
  let body='', nav='';
  if(S.step===1){
    body=`<h2>Votre prestation</h2><div>${menuRows()}</div><p class="muted">Tarifs hors mèches.</p>`;
  }
  if(S.step===2){
    const shown=s.variants.filter(x=>(x.p!=null||x.quote)&&!x.hidden);
    const groups=[...new Set(shown.map(x=>x.g))];
    body=`<h2>${esc(s.name)}</h2>${s.photo?`<img class="cover" src="${s.photo}" alt="${esc(s.name)}">`:''}`+groups.map(g=>`<div class="group">${g?`<h3>${esc(g)}</h3>`:''}${
      s.variants.map((x,i)=>x.g===g&&(x.p!=null||x.quote)&&!x.hidden?`<div class="mwrap">${thumb(x)}<button class="mrow" data-act="variant" data-i="${i}" aria-pressed="${b.vi===i}" ${bookable(x)?'':'disabled'}><span class="ml">${esc(x.l)}${x.d?`<br><small>≈ ${dur(x.d)}</small>`:''}</span><i class="lead"></i><span class="pill">${x.quote||x.p==null?'Sur devis':(x.from?'dès ':'')+eur(x.p)}</span></button></div>`:'').join('')}</div>`).join('');
    if(s.variants.some(x=>x.quote||x.from)) body+=`<p class="muted">${quoteHow()}</p>`;
  }
  if(S.step===3){
    const f=travelFee(b.cp), cat=CATEGORIES.find(c=>c.id===s.cat);
    S.condNow=new Set();
    const gb=visGroups(s,v).map(groupBlock).join(''); S.condShown=S.condNow;
    body=`<h2>Options</h2>`+slBlock()+hairBlock()+gb;
    if(cat.home) body+=`<div class="card"><label class="opt" style="padding-top:0"><input type="checkbox" ${b.home?'checked':''} data-act="home"><span><b>Coiffure à domicile</b><br><small class="muted">Partout en Île-de-France. Frais de déplacement calculés selon votre adresse, dès 10 € à Paris.</small></span></label>
      ${b.home?`<label for="cp" class="muted">Code postal</label><input id="cp" type="text" inputmode="numeric" maxlength="5" value="${esc(b.cp)}" placeholder="75001" data-act="cp">${SITE_MODE?`<label for="addr" class="muted" style="margin-top:8px;display:block">Adresse complète</label><input id="addr" type="text" autocomplete="street-address" value="${esc(b.addr||'')}" placeholder="Numéro, rue, ville, étage, code…" data-act="addr">`:''}
      <p style="margin:10px 0 0" class="muted">${f===null?'Saisissez votre code postal pour calculer les frais.':isNaN(f)?'Adresse hors Île-de-France : le service à domicile n’est pas disponible.':'Frais de déplacement : '+eur(f)}</p>`:''}</div>`;
    body+=`<div class="card"><label for="note" style="display:block;margin-bottom:6px"><b>Un mot pour la coiffeuse</b> <span class="muted">(facultatif)</span></label><textarea id="note" rows="3" maxlength="300" data-field="note" placeholder="Une précision, une envie particulière…">${esc(b.note)}</textarea></div>`;
  }
  if(S.step===4){
    const days=[...Array(SITE_MODE?21:10)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return d});
    const w=S.waitFor;
    body=`<h2>Date et heure</h2><p class="muted">Durée de la prestation : ${v&&v.d?dur(v.d):'à confirmer par la coiffeuse'}.</p><div class="days" role="group" aria-label="Jours">${days.map(d=>{const k=d.toISOString().slice(0,10);return `<button class="day" aria-pressed="${b.date===k}" data-act="date" data-d="${k}">${d.toLocaleDateString('fr-FR',{weekday:'short'})}<b>${d.getDate()}</b>${d.toLocaleDateString('fr-FR',{month:'short'})}</button>`}).join('')}</div>
    ${b.date?(SITE_MODE?liveSlotsHtml(b,v):`<div class="slots">${SLOTS.map(t=>{const full=isTaken(b.date,t);const on=w&&w.date===b.date&&w.slot===t;return `<button class="slot ${full?'full':''}" aria-pressed="${full?on:b.slot===t}" data-act="${full?'wopen':'slot'}" data-t="${t}">${t}${full?'<small>Complet</small>':''}</button>`}).join('')}</div>
    <p class="muted" style="margin-top:10px">Créneau complet ? Touchez-le pour rejoindre la liste d’attente.</p>`):'<p class="muted">Choisissez un jour pour voir les créneaux disponibles.</p>'}
    ${w&&b.date===w.date?waitPanel(w):''}`;
  }
  if(S.step===5){
    body=`<h2>Vos coordonnées</h2><div class="card"><p class="muted">Nous les utilisons pour confirmer votre rendez-vous et vous envoyer un rappel par e-mail et par SMS 24 h et 2 h avant la prestation.</p>
      <label class="fl" for="c-name">Prénom et nom</label><input id="c-name" type="text" autocomplete="name" value="${esc(b.name)}" data-field="name">
      <label class="fl" for="c-email">E-mail</label><input id="c-email" type="email" autocomplete="email" inputmode="email" value="${esc(b.email)}" data-field="email" placeholder="prenom@exemple.fr">
      <label class="fl" for="c-phone">Téléphone</label><input id="c-phone" type="tel" autocomplete="tel" inputmode="tel" value="${esc(b.phone)}" data-field="phone" placeholder="06 12 34 56 78"></div>`;
  }
  if(S.step===6){
    body=`<h2>Avant de confirmer</h2><div class="card">
      <label class="opt"><input type="checkbox" ${b.rules?'checked':''} data-act="rules"><span>Merci de vous présenter avec les cheveux <b>impérativement propres</b>. Le démêlage préalable n’est pas obligatoire.</span></label>
      <label class="opt"><input type="checkbox" ${b.cancel?'checked':''} data-act="cancel"><span>J’ai lu et j’accepte la politique d’annulation : l’acompte n’est pas remboursé en cas d’annulation moins de 48 h avant le rendez-vous.</span></label></div>`;
  }
  if(S.step===7){
    const p=pricing(), pend=p.pending;
    body=`<h2>${pend?'Votre demande':'Acompte'}</h2>${pend?`<div class="card okc"><h4>Tarif à confirmer</h4><p class="muted" style="margin:0">Certains montants ne sont pas encore connus. La coiffeuse vous confirme le tarif et la durée par e-mail et par SMS avant tout paiement. Aucun acompte n’est demandé maintenant, et le créneau n’est pas encore réservé.</p></div>`:''}
      <div class="card">${p.lines.map(l=>`<div class="sum"><span>${esc(l[0])}</span><span>${l[1]==null?'À confirmer':eur(l[1])}</span></div>`).join('')}
      <div class="sum total"><span>${pend?'Total estimé':'Total'}</span><span>${(v&&v.from)||pend?'à partir de ':''}<span data-cu="${p.total}">${eur(p.total)}</span></span></div>
      <div class="sum"><span>Durée</span><span>${p.dur?dur(p.dur):'À confirmer'}</span></div>
      ${pend?`<div class="sum"><span>Acompte</span><span>Après confirmation du tarif</span></div>`:`<div class="sum"><span>Acompte à payer maintenant (${Math.round(CFG.depositRate*100)} %)</span><b data-cu="${p.deposit}">${eur(p.deposit)}</b></div>`}</div>
      ${pend?'':SITE_MODE?`<div class="card"><h4>Paiement sécurisé</h4><p class="muted" style="margin:0">Vous serez redirigée vers la page de paiement sécurisée Stripe : carte bancaire, Apple Pay ou Google Pay selon votre appareil. Le reste se règle le jour du rendez-vous.</p></div>`:`<div class="card"><h4>Moyen de paiement</h4>${PAYMENTS.map(([id,l])=>`<label class="opt"><input type="radio" name="pay" ${b.pay===id?'checked':''} data-act="pay" data-id="${id}"><span>${l}</span></label>`).join('')}
      <p class="muted" style="margin:10px 0 0">Prototype : aucun paiement réel.</p></div>`}`;
  }
  if(S.step>1) nav=`<div class="row" style="margin-top:20px"><button class="btn ghost" data-act="back" style="flex:1">Retour</button>
    <button class="btn" style="flex:2" data-act="next" ${canNext()&&!LIVE.busy?'':'disabled'}>${S.step===7?(LIVE.busy?'Un instant…':pricing().pending?'Envoyer ma demande':'Payer l’acompte'):'Continuer'}</button></div>`;
  return stepBar()+body+nav;
}
function waitPos(w){const k=slotKey(w.date,w.slot);return S.wait.filter(x=>x.key===k&&x.status==='En attente').length+1}
function waitPanel(w){
  const k=slotKey(w.date,w.slot), mine=S.wait.find(x=>x.key===k&&x.svcId===S.b.service&&x.email.toLowerCase()===S.wl.email.trim().toLowerCase()&&x.status==='En attente');
  if(mine){const pos=S.wait.filter(x=>x.key===k&&x.status==='En attente').indexOf(mine)+1;
    return `<div class="card" role="status"><h4>Vous êtes sur la liste d’attente</h4><p style="margin:0">${dayLabel(w.date)} à ${w.slot} · position ${pos}. Si le créneau se libère, vous serez prévenue par e-mail et par SMS.</p></div>`;}
  return `<div class="card"><h4>Créneau complet : ${dayLabel(w.date)} à ${w.slot}</h4><p class="muted">Rejoignez la liste d’attente. Si le créneau se libère, vous serez prévenue par e-mail et par SMS, dans l’ordre d’inscription.</p>
    <label class="fl" for="w-email">E-mail</label><input id="w-email" type="email" autocomplete="email" inputmode="email" value="${esc(S.wl.email)}" data-wfield="email" placeholder="prenom@exemple.fr">
    <label class="fl" for="w-phone">Téléphone</label><input id="w-phone" type="tel" autocomplete="tel" inputmode="tel" value="${esc(S.wl.phone)}" data-wfield="phone" placeholder="06 12 34 56 78">
    <button class="btn" style="margin-top:14px" data-act="wjoin" ${wlOk()?'':'disabled'}>Me mettre sur la liste d’attente</button></div>`;
}
function confirmation(){
  const d=S.done;
  if(d.kind==='checking') return `<h2 style="text-align:center">Vérification du paiement…</h2><p class="muted" style="text-align:center" role="status">Un instant, nous confirmons votre rendez-vous.</p>`;
  if(d.kind==='pending') return `<h2 style="text-align:center">Paiement en cours de confirmation</h2><div class="card"><p>Votre paiement est en cours de traitement. Dès qu’il est confirmé, vous recevez un e-mail de confirmation${d.email?` à ${esc(d.email)}`:''}.</p><p class="muted">Si vous n’avez rien reçu d’ici 15 minutes, écrivez-nous sur Instagram @${esc(CFG.contact.insta)} en précisant votre nom.</p></div><button class="btn" data-act="reset">Retour à l’accueil</button>`;
  if(d.kind==='booking') return `<div class="okmark" role="img" aria-label="Rendez-vous confirmé"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15 27l8 8 14-16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h2 style="text-align:center">Rendez-vous confirmé</h2><div class="card">
    <div class="sum"><span>Prestation</span><b style="text-align:right">${esc(d.svc)}</b></div>
    <div class="sum"><span>Date</span><b style="text-align:right">${esc(d.when)}</b></div>
    <div class="sum"><span>Acompte payé</span><b>${eur(d.deposit)}</b></div>
    <div class="sum"><span>Reste à régler le jour J</span><b>${eur(d.balance)}</b></div></div>
  <p class="muted">Une confirmation vient d’être envoyée à ${esc(d.email)}. Vous recevrez un rappel la veille et 2 h avant. Cheveux impérativement propres, démêlage non obligatoire.</p>
  <button class="btn" data-act="reset">Retour à l’accueil</button>`;
  if(d.kind==='request') return `<div class="okmark" role="img" aria-label="Demande envoyée"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15 27l8 8 14-16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h2 style="text-align:center">Demande envoyée</h2><div class="card">
    <div class="sum"><span>Coiffure</span><b style="text-align:right">${esc(d.svc)}</b></div>
    <div class="sum"><span>Créneau souhaité</span><b>${esc(d.when)}</b></div></div>
  <p class="ok-msg">Votre demande a bien été envoyée à la coiffeuse. Elle vous confirme le tarif et la durée par e-mail ou par SMS (${esc(d.email)}) avant tout paiement. Ce créneau n’est pas encore réservé.</p>
  <button class="btn" data-act="reset" style="margin-top:14px">Retour à l’accueil</button>`;
  return `<div class="okmark" role="img" aria-label="Rendez-vous confirmé"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15 27l8 8 14-16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h2 style="text-align:center">Rendez-vous confirmé</h2><div class="card">
    <div class="sum"><span>Prestation</span><b style="text-align:right">${esc(d.svc)}</b></div>
    <div class="sum"><span>Date</span><b>${esc(d.when)}</b></div>
    <div class="sum"><span>Acompte payé</span><b>${eur(d.deposit)}</b></div></div>
  <p class="muted">Une confirmation est envoyée à ${esc(d.email)}. Vous recevrez un rappel par e-mail et par SMS 24 h et 2 h avant le rendez-vous. +${d.pts} points ajoutés à votre carte de fidélité.</p>
  <button class="btn" data-act="reset">Retour à l’accueil</button>`;
}
function galleryItems(){
  const items=S.gallery.map(g=>{ const m=g.media[g.cover]||g.media[0]; const photo=m?(m.type==='photo'?m.src:(m.poster||null)):null;
    return {l:g.title,photo,gid:g.id,n:g.media.length,video:!!(m&&m.type==='video')}; });
  SERVICES.forEach(s=>{ if(!(s.visible&&catOn(s.cat))) return; if(s.photo) items.push({l:s.name,photo:s.photo,gid:null,n:1}); s.variants.forEach(v=>{ if(v.photo&&!v.hidden) items.push({l:v.l,photo:v.photo,gid:null,n:1}); }); });
  while(items.length<6) items.push({l:'Photo à venir',photo:null,gid:null,n:0});
  return items.slice(0,12);
}

function viewerHtml(){
  const vw=S.viewer; if(!vw) return '';
  const g=S.gallery.find(x=>x.id===vw.gid); if(!g||!g.media.length) return '';
  const i=Math.max(0,Math.min(vw.i,g.media.length-1)), m=g.media[i];
  const media = m.type==='video'
    ? (m.src?`<video src="${m.src}" ${m.poster?`poster="${m.poster}"`:''} controls playsinline preload="metadata" aria-label="${esc(g.title)}"></video>`:'<p class="vmiss">Cette vidéo n’est plus disponible dans l’aperçu (elle n’est pas conservée après rechargement).</p>')
    : `<img src="${m.src}" alt="${esc(g.title)}">`;
  return `<div class="lightbox" data-act="unzoom" role="dialog" aria-label="${esc(g.title)}">
    <div class="vbox">${media}
      <div class="vcap"><b>${esc(g.title)}</b>${g.cat?` <span class="badge">${esc(g.cat)}</span>`:''}${g.desc?`<p>${esc(g.desc)}</p>`:''}</div>
      ${g.media.length>1?`<div class="vnav"><button class="btn small ghost" data-act="vnav" data-d="-1" aria-label="Précédent">‹</button><span>${i+1} / ${g.media.length}</span><button class="btn small ghost" data-act="vnav" data-d="1" aria-label="Suivant">›</button></div>`:''}</div>
    <button class="btn small" style="position:absolute;top:16px;right:16px" data-act="unzoom">Fermer</button></div>`;
}

const scopeText=(s,g)=>{const sc=g.scope||{mode:'all'}; if(sc.mode==='all') return 'Tous les modèles'; const n=(sc.ids||[]).map(id=>(s.variants.find(v=>v.id===id)||{}).l).filter(Boolean); if(!n.length) return 'Aucun modèle choisi'; return (sc.mode==='one'?'Un seul modèle : ':'Modèles : ')+(n.length>2?n.slice(0,2).join(', ')+' +'+(n.length-2):n.join(', '));};

/* nettoie les conditions devenues invalides (question supprimée, déplacée avant son parent, option supprimée) */
function cleanConds(s){ let n=0; s.groups.forEach((g,i)=>{ if(!g.cond) return; const pi=s.groups.findIndex(x=>x.id===g.cond.gid), p=s.groups[pi];
  const okV=p&&(p.kind==='yesno'?(g.cond.v==='yes'||g.cond.v==='no'):p.items.some(x=>x.id===g.cond.v));
  if(!p||pi>=i||!okV){ g.cond=null; n++; } }); return n; }
function cloneIds(s){ /* copie profonde d’une prestation avec de nouveaux identifiants cohérents */
  const c=JSON.parse(JSON.stringify(s)), vm={}, gm={}, im={};
  c.id='svc-'+uid(); c.variants.forEach(v=>{const o=v.id; v.id=uid(); vm[o]=v.id;});
  c.groups.forEach(g=>{const o=g.id; g.id=uid(); gm[o]=g.id; g.items.forEach(x=>{const oi=x.id; x.id=uid(); im[oi]=x.id;});});
  c.groups.forEach(g=>{ g.scope.ids=(g.scope.ids||[]).map(i=>vm[i]).filter(Boolean); if(g.cond){ g.cond.gid=gm[g.cond.gid]; if(im[g.cond.v]) g.cond.v=im[g.cond.v]; } });
  if(c.hair) c.hair.types.forEach(t=>{t.id=uid();});
  return c; }

        <label class="opt"><input type="checkbox" ${s.hair.perBundle?'checked':''} data-act="hbundle" data-s="${s.id}"><span>Je facture au bundle<br><small class="muted">La cliente indique le nombre de bundles.</small></span></label>
        <button class="btn small ghost" data-act="hairoff" data-s="${s.id}">Ne plus proposer de mèches</button></div>`
    : showsHair(s) ? `<div class="card"><h4>Mèches</h4><p class="muted">Cette prestation ne propose pas de mèches.</p><button class="btn ghost" data-act="hairon" data-s="${s.id}">Proposer des mèches</button></div>` : '';
  const asks=s.variants.some(v=>v.askSize||v.askLen), miss=refMissing(s);
  const supplCard = asks ? `<div class="card"><h4>Grosseur et longueur</h4><p class="muted">Chaque modèle indique ce qui est compris dans son prix. Ici, vous fixez le supplément ajouté quand la cliente choisit autre chose.</p><button class="btn ghost" data-act="supplopen" data-s="${s.id}">Régler les suppléments</button></div>` : '';
  const missCard = miss.length ? `<div class="card"><h4>À compléter</h4><p class="muted" style="margin:0 0 10px">${miss.length} modèle${miss.length>1?'s n’indiquent':' n’indique'} pas la grosseur ou la longueur comprise dans leur prix. Tant que ce n’est pas réglé, la cliente reçoit une demande de tarif au lieu d’une réservation directe.</p><button class="btn" data-act="refallopen" data-s="${s.id}">Régler maintenant</button></div>` : '';
  return `<button class="btn ghost small" data-act="svcback">‹ Toutes les prestations</button><h2 style="margin-top:16px">${esc(s.name)}</h2>
  <div class="row" style="gap:8px;margin-bottom:6px;flex-wrap:wrap"><button class="btn small ghost" style="flex:1;white-space:nowrap" data-act="pvsvc" data-s="${s.id}">Voir comme une cliente</button><button class="btn small ghost" style="flex:1" data-act="svcdup" data-s="${s.id}">Dupliquer</button></div>${status}${missCard}
  <div class="card"><h4>Photo de la prestation</h4><div class="phrow">${s.photo?`<img class="mthumb" src="${s.photo}" alt="Photo actuelle">`:'<span class="muted">Aucune photo</span>'}<button class="btn small ghost" data-act="svcphoto" data-s="${s.id}">${s.photo?'Changer':'Ajouter une photo'}</button>${s.photo?`<button class="btn small ghost" data-act="svcphotodel" data-s="${s.id}">Retirer</button>`:''}</div></div>
  <div class="card"><h4>Modèles</h4><p class="muted">Les coiffures ou soins que la cliente peut choisir : nom, prix, durée et photo.</p>
    ${s.variants.map((v,i)=>lrow(`data-act="modeledit" data-s="${s.id}" data-i="${i}"`,avatar(v.photo,v.l),v.l,modelSub(v)+(v.hidden?' · masqué':'')+(((v.askSize&&!(v.refSize||s.refSize))||(v.askLen&&!(v.refLen||s.refLength)))?' · comprend : à définir':''))).join('')}
    <button class="btn ${s.variants.length?'ghost':''}" style="margin-top:12px" data-act="modeladd" data-s="${s.id}">+ Ajouter un modèle</button></div>
  ${hairCard}
  <div class="card"><h4>Choix proposés à la cliente</h4><p class="muted">Les questions posées à la cliente en plus du modèle : choix, texte, nombre, photo, oui/non. Chaque choix peut concerner tous les modèles, quelques-uns ou un seul, et apparaître seulement selon une réponse précédente.</p>
    ${s.groups.map(g=>`<div class="choice"><div class="row"><div style="min-width:0"><b>${esc(g.l)}</b>${g.hidden?' <span class="badge">Masqué</span>':''}<br><small class="muted">${GKINDS[g.kind]} · ${g.required?'obligatoire':'facultatif'}</small><br><small class="muted">${esc(scopeText(s,g))}</small>${g.cond?`<br><small class="muted">${esc(condText(s,g))}</small>`:''}</div><button class="btn small ghost" data-act="choiceedit" data-s="${s.id}" data-g="${g.id}">Réglages</button></div>
      ${hasItems(g.kind)?g.items.map((x,j)=>lrow(`data-act="optedit" data-s="${s.id}" data-g="${g.id}" data-i="${j}"`,avatar(x.photo,x.l),x.l,optSub(x)+(x.hidden?' · masquée':''))).join('')+`<button class="btn small ghost" style="margin-top:10px" data-act="optadd" data-s="${s.id}" data-g="${g.id}">+ Ajouter une option</button>`:`<p class="muted" style="margin:10px 0 0">${g.kind==='text'?'La cliente écrit sa réponse.':g.kind==='photo'?'La cliente importe une photo.':g.kind==='yesno'?`Oui ou Non${g.price!=null?` · + ${eur(g.price)} si Oui`:''}.`:`Nombre${g.unit?' de '+esc(g.unit):''}${g.price!=null?` · ${eur(g.price)} l’unité`:''}.`}</p>`}</div>`).join('')||'<p class="muted">Aucun choix pour l’instant.</p>'}
    <button class="btn ghost" style="margin-top:12px" data-act="choiceadd" data-s="${s.id}">+ Ajouter un choix</button></div>
  ${supplCard}
  <button class="btn small ghost" style="margin-top:8px" data-act="svcdel" data-s="${s.id}">${S.delArm==='svc:'+s.id?'Confirmer la suppression de la prestation':'Supprimer cette prestation'}</button>`;
}

/* ----- Fenêtres de saisie (une chose à la fois, bouton Enregistrer) ----- */
const err = k => S.sheet.err&&S.sheet.err[k] ? `<p class="err" role="alert">⚠ ${S.sheet.err[k]}</p>` : '';
const fld = (label,key,val,o={}) => `<label class="fl" for="sf-${key}">${label}</label><div class="fwrap"><input id="sf-${key}" type="${o.type||'text'}" ${o.mode?`inputmode="${o.mode}"`:''} ${o.type==='number'?'min="0" step="any"':''} value="${esc(val)}" placeholder="${esc(o.ph||'')}" data-sf="${key}" ${o.suffix?'style="padding-right:38px"':''}>${o.suffix?`<span class="sfx">${o.suffix}</span>`:''}</div>${o.hint?`<p class="hint">${o.hint}</p>`:''}${err(key)}`;
const durBlock = (f,label,hint) => `<span class="fl">${label}</span><div class="dur big"><input id="sf-h" type="number" min="0" max="24" inputmode="numeric" value="${esc(f.h)}" data-sf="h" aria-label="Heures"><span>h</span><input id="sf-m" type="number" min="0" max="59" step="5" inputmode="numeric" value="${esc(f.m)}" data-sf="m" aria-label="Minutes"><span>min</span></div>
  <div class="chips qd" role="group" aria-label="Durées rapides">${[[30,'30 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h'],[180,'3 h'],[240,'4 h'],[300,'5 h']].map(([v,l])=>`<button class="chip" data-act="qdur" data-v="${v}">${l}</button>`).join('')}</div>${hint?`<p class="hint">${hint}</p>`:''}${err('d')}`;
const photoBlock = f => `<span class="fl">Photo <span class="muted">(facultatif)</span></span><div class="phrow">${f.photo?`<img class="mthumb" src="${f.photo}" alt="Photo actuelle">`:'<span class="muted">Aucune photo</span>'}<button class="btn small ghost" data-act="shphoto">${f.photo?'Changer':'Ajouter une photo'}</button>${f.photo?'<button class="btn small ghost" data-act="shphotodel">Retirer</button>':''}</div>`;
const switchRow = (k,label,on) => `<label class="opt"><input type="checkbox" ${on?'checked':''} data-act="sfset" data-k="${k}"><span>${label}</span></label>`;
const shHead = (title,sub) => `<div class="sh-head"><h2>${title}</h2><button class="x" data-act="sheetclose" aria-label="Fermer">×</button></div>${sub?`<p class="ok-msg" style="margin:0 0 6px">${sub}</p>`:''}`;
const shFoot = (save,del) => `<div class="foot-actions"><button class="btn ghost" style="flex:1" data-act="sheetclose">Annuler</button><button class="btn" style="flex:2" data-act="sheetsave">${save||'Enregistrer'}</button></div>${del?`<button class="btn small ghost" style="margin-top:12px" data-act="sheetdel">${S.sheet.del?'Confirmer la suppression':del}</button>`:''}`;

const SH = {
  model(sh){ const s=svcById(sh.sid), f=sh.f, edit=sh.i!=null, v=edit?s.variants[sh.i]:null;
    const refSel=(key,label,list,cur)=>`<label class="fl" for="sf-${key}">${label}</label><select class="sel" id="sf-${key}" data-sf="${key}" style="max-width:100%;width:100%"><option value="">Choisir…</option>${list.filter(x=>x[0]!=='other').map(([k,l])=>`<option value="${k}" ${cur===k?'selected':''}>${l}</option>`).join('')}</select><p class="hint">Ce que la cliente reçoit sans supplément pour ce prix.</p>${err(key)}`;
    return shHead(edit?'Modifier le modèle':'Nouveau modèle',sh.banner)
      +fld('Nom du modèle','name',f.name,{ph:'Ex. : '+(EXAMPLE[s.tpl]||'Mon modèle')})
      +fld(v&&v.quote?'Prix (laissez vide : sur devis)':'Prix','price',f.price,{type:'number',mode:'decimal',suffix:'€',hint:showsHair(s)?'Le prix de la prestation, mèches non comprises.':''})
      +durBlock(f,'Durée de la prestation','Le temps réservé dans votre planning.')
      +photoBlock(f)
      +((showsSize(s)||showsLen(s))?`<span class="fl">La cliente doit préciser</span>${showsSize(s)?switchRow('askSize','La grosseur des tresses',f.askSize):''}${showsLen(s)?switchRow('askLen','La longueur',f.askLen):''}`:'')
      +(f.askSize?refSel('refSize','Grosseur comprise dans ce tarif',SIZES,f.refSize):'')
      +(f.askLen?refSel('refLen','Longueur comprise dans ce tarif',LENGTHS,f.refLen):'')
      +((f.askSize||f.askLen)?switchRow('applyAll','Utiliser cette référence pour les autres modèles qui n’en ont pas encore',f.applyAll):'')
      +`<span class="fl">Visibilité</span>`+switchRow('visible','Visible par les clientes',f.visible)
      +(edit?manageRow():'')
      +shFoot('Enregistrer',edit?'Supprimer ce modèle':'');},
  hair(sh){ const s=svcById(sh.sid), f=sh.f, per=s.hair.perBundle;
    return shHead(sh.i!=null?'Modifier le type de mèches':'Nouveau type de mèches')
      +fld('Nom','name',f.name,{ph:'Ex. : Naturelles'})
      +fld(per?'Prix par bundle':'Supplément ajouté au tarif','price',f.price,{type:'number',mode:'decimal',suffix:'€',hint:'Laissez vide si le prix n’est pas encore décidé : la cliente verra « à définir ».'})
      +shFoot('Enregistrer',sh.i!=null?'Supprimer ce type':'');},
  choice(sh){ const s=svcById(sh.sid), f=sh.f, edit=!!sh.gid;
    const own=edit?s.groups.findIndex(x=>x.id===sh.gid):s.groups.length;
    const parents=s.groups.slice(0,own).filter(g=>['single','multi','yesno'].includes(g.kind));
    const par=parents.find(g=>g.id===f.condG);
    const sel=(key,opts,cur,ph)=>`<select class="sel" data-sf="${key}" style="max-width:100%;width:100%"><option value="">${ph}</option>${opts.map(([k,l])=>`<option value="${esc(k)}" ${cur===k?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    return shHead(edit?'Réglages du choix':'Nouveau choix')
      +fld('Question posée à la cliente','name',f.name,{ph:'Ex. : Type de boucles'})
      +`<span class="fl">Type de réponse</span><div class="kinds">${Object.entries(GKINDS).map(([k,l])=>`<button class="kind" aria-pressed="${f.kind===k}" data-act="sfset" data-k="kind" data-v="${k}"><b>${l}</b><small>${KEX[k]}</small></button>`).join('')}</div>`
      +(f.kind==='text'?fld('Texte d’aide (facultatif)','ph',f.ph,{ph:'Ex. : Décrivez la coiffure souhaitée'}):'')
      +(f.kind==='number'?fld('Unité (facultatif)','unit',f.unit,{ph:'Ex. : bundles'})+fld('Minimum','min',f.min,{type:'number',mode:'numeric'})+fld('Maximum (facultatif)','max',f.max,{type:'number',mode:'numeric'})+fld('Prix par unité (facultatif)','price',f.price,{type:'number',mode:'decimal',suffix:'€',hint:'Laissez vide si le nombre sert seulement à vous informer.'}):'')
      +(f.kind==='yesno'?fld('Supplément si la réponse est « Oui » (facultatif)','price',f.price,{type:'number',mode:'decimal',suffix:'€'}):'')
      +(hasItems(f.kind)&&!edit?`<p class="hint">Vous ajouterez les options de ce choix à l’étape suivante.</p>`:'')
      +switchRow('required','Réponse obligatoire',f.required)
      +`<span class="fl" style="margin-top:14px">Afficher ce choix pour</span><div class="kinds">${[['all','Tous les modèles','Le choix apparaît pour chaque modèle'],['some','Certains modèles uniquement','Vous cochez les modèles concernés'],['one','Un seul modèle','Le choix n’apparaît que pour un modèle']].map(([k,l,d])=>`<button class="kind" aria-pressed="${f.scopeMode===k}" data-act="sfset" data-k="scopeMode" data-v="${k}"><b>${l}</b><small>${d}</small></button>`).join('')}</div>`
      +(f.scopeMode!=='all'?`<span class="fl">Modèles concernés</span>${s.variants.length?s.variants.map(v=>`<label class="opt"><input type="${f.scopeMode==='one'?'radio':'checkbox'}" name="scope" ${f.scopeIds.includes(v.id)?'checked':''} data-act="sfmodel" data-id="${v.id}"><span>${esc(v.l)}</span></label>`).join(''):'<p class="hint">Ajoutez d’abord des modèles à cette prestation.</p>'}${err('scope')}`:'')
      +`<span class="fl" style="margin-top:14px">Question conditionnelle</span>`
      +(parents.length?switchRow('condOn','Afficher seulement selon une réponse précédente',f.condOn)+`<p class="hint">Évite de surcharger le formulaire : la question n’apparaît que si la cliente a donné la réponse choisie.</p>`
        +(f.condOn?`<span class="fl">Si la réponse à…</span>${sel('condG',parents.map(g=>[g.id,g.l]),f.condG,'Choisir une question')}${par?`<span class="fl">…est</span>${sel('condV',par.kind==='yesno'?[['yes','Oui'],['no','Non']]:par.items.map(x=>[x.id,x.l]),f.condV,'Choisir une réponse')}`:''}${err('cond')}`:'')
        :`<p class="hint">Pour une question conditionnelle, créez d’abord une question « Réponse unique », « Choix multiples » ou « Oui / Non » placée avant celle-ci.</p>`)
      +`<span class="fl" style="margin-top:14px">Visibilité</span>`+switchRow('visible','Visible par les clientes',f.visible)
      +(edit?manageRow():'')
      +shFoot(edit?'Enregistrer':(hasItems(f.kind)?'Créer le choix':'Enregistrer'),edit?'Supprimer ce choix':'');},
  opt(sh){ const s=svcById(sh.sid), g=s.groups.find(x=>x.id===sh.gid), f=sh.f, edit=sh.i!=null;
    return shHead(edit?'Modifier l’option':'Nouvelle option',sh.banner||'')
      +`<p class="muted" style="margin:6px 0 0">Choix : <b>${esc(g.l)}</b></p>`
      +fld('Nom de l’option','name',f.name,{ph:'Ex. : Amande'})
      +fld('Prix','price',f.price,{type:'number',mode:'decimal',suffix:'€',hint:'Ce que cette option ajoute au tarif. Laissez vide si le prix n’est pas encore décidé.'})
      +durBlock(f,'Temps en plus','Laissez vide si cette option n’ajoute pas de temps.')
      +(g.kind==='multi'?fld('Vendue à l’unité (facultatif)','unit',f.unit,{ph:'Ex. : ongles, locks',hint:'La cliente indiquera alors un nombre.'}):'')
      +photoBlock(f)
      +`<span class="fl">Visibilité</span>`+switchRow('visible','Visible par les clientes',f.visible)
      +(edit?manageRow():'')
      +shFoot('Enregistrer',edit?'Supprimer cette option':'');},
  newsvc(sh){ const f=sh.f, k=KINDS.find(x=>x.k===f.kind);
    return shHead('Nouvelle prestation')
      +`<span class="fl" style="margin-top:6px">1. Que proposez-vous ?</span><div class="kinds">${KINDS.map(x=>`<button class="kind" aria-pressed="${f.kind===x.k}" data-act="sfset" data-k="kind" data-v="${x.k}"><b>${x.t}</b><small>${x.d}</small></button>`).join('')}</div>`
      +(k?`<span class="fl" style="margin-top:18px">2. Comment l’appeler ?</span>`+fld('Nom de la prestation','name',f.name,{ph:'Ex. : '+(EXAMPLE[k.k]||'')})+`<p class="hint">Le menu est préparé pour ce type de prestation (${TPL[k.k].l.toLowerCase()}). Vous pourrez tout modifier ensuite.</p>`:'')
      +shFoot('Créer la prestation');},
  suppl(sh){ const s=svcById(sh.sid), f=sh.f;
    const num=(map,key,k,l)=>`<div class="edit"><label for="sk-${key}-${k}">${l}</label><div class="fwrap" style="width:120px"><input id="sk-${key}-${k}" type="number" min="0" step="any" inputmode="decimal" value="${esc(f[map][k]??'')}" data-sk="${map}" data-si="${k}" style="padding-right:30px;width:100%"><span class="sfx">€</span></div></div>`;
    const hasS=s.variants.some(v=>v.askSize), hasL=s.variants.some(v=>v.askLen);
    return shHead('Grosseur et longueur')+`<p class="muted">Chaque modèle indique la grosseur et la longueur comprises dans son prix. Ci-dessous, le supplément ajouté quand la cliente choisit autre chose. Laissez vide si vous n’avez pas encore décidé : la cliente enverra alors une demande de tarif.</p>`
      +(hasS?`<span class="fl">Supplément selon la grosseur</span>${SIZES.map(([k,l])=>num('sizeSupp','s',k,l)).join('')}`:'')
      +(hasL?`<span class="fl" style="margin-top:16px">Supplément selon la longueur</span>${LENGTHS.filter(x=>x[0]!=='other').map(([k,l])=>num('lengthSupp','l',k,l)).join('')}`:'')
      +shFoot('Enregistrer');},
  refall(sh){ const s=svcById(sh.sid), f=sh.f, miss=refMissing(s);
    const needS=miss.some(v=>v.askSize&&!(v.refSize||s.refSize)), needL=miss.some(v=>v.askLen&&!(v.refLen||s.refLength));
    const sel=(key,label,list,cur)=>`<label class="fl" for="sf-${key}">${label}</label><select class="sel" id="sf-${key}" data-sf="${key}" style="max-width:100%;width:100%"><option value="">Choisir…</option>${list.filter(x=>x[0]!=='other').map(([k,l])=>`<option value="${k}" ${cur===k?'selected':''}>${l}</option>`).join('')}</select>${err(key)}`;
    return shHead('Grosseur et longueur comprises')+`<p class="muted">Pour ${miss.length} modèle${miss.length>1?'s':''} : quelle grosseur et quelle longueur sont comprises dans le prix de base ? Les autres choix de la cliente seront alors ajoutés au tarif.</p>`
      +(needS?sel('refSize','Grosseur comprise dans le prix',SIZES,f.refSize):'')+(needL?sel('refLen','Longueur comprise dans le prix',LENGTHS,f.refLen):'')
      +`<p class="hint">Vous pourrez ajuster chaque modèle séparément ensuite.</p>`+shFoot('Appliquer');},
  gal(sh){ const f=sh.f, edit=!!sh.gid;
    return shHead(edit?'Modifier la réalisation':'Nouvelle réalisation')
      +fld('Titre','title',f.title,{ph:'Ex. : Knotless longues'})
      +`<label class="fl" for="sf-cat">Catégorie</label><select class="sel" id="sf-cat" data-sf="cat" style="max-width:100%;width:100%">${GAL_CATS.map(c=>`<option value="${c}" ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>`
      +`<label class="fl" for="sf-desc">Description <span class="muted">(facultatif)</span></label><textarea id="sf-desc" rows="3" maxlength="300" data-sf="desc" placeholder="Technique, durée, détails…">${esc(f.desc)}</textarea>`
      +`<span class="fl">Photos et vidéos</span>`
      +(f.media.length?`<div class="gmedia">${f.media.map((m,i)=>`<div class="gm ${f.cover===i?'cover':''}">${m.type==='video'?(m.poster?`<img src="${m.poster}" alt="Aperçu vidéo">`:'<span class="gmv">▶</span>'):`<img src="${m.src}" alt="Photo ${i+1}">`}<span class="gtype">${m.type==='video'?'Vidéo':'Photo'}</span><div class="gmact"><button class="btn small ${f.cover===i?'':'ghost'}" data-act="galcover" data-i="${i}">${f.cover===i?'Miniature ✓':'Miniature'}</button><button class="btn small ghost" data-act="galmediadel" data-i="${i}" aria-label="Retirer">✕</button></div></div>`).join('')}</div>`:'<p class="muted">Aucun fichier pour l’instant.</p>')
      +`<button class="btn ghost" style="margin-top:10px" data-act="galpick">+ Importer des photos ou vidéos</button>`
      +(sh.busy?'<p class="hint" role="status">Import en cours…</p>':'')+`<p class="hint">Aperçu local seulement : les photos sont conservées dans votre sauvegarde, pas les vidéos.</p>${err('media')}`
      +shFoot('Enregistrer',edit?'Supprimer cette réalisation':'');},
  export(sh){ const f=sh.f, txt=exportText(f.withPhotos);
    return shHead('Exporter les données')+`<p class="muted">Prestations, choix, galerie, demandes et réservations du prototype, dans un fichier JSON à conserver ou à réimporter.</p>`
      +switchRow('withPhotos','Inclure les photos (fichier plus lourd)',f.withPhotos)+`<p class="hint">${f.withPhotos?'Les vidéos ne sont jamais incluses.':'Sans les photos, il faudra les ajouter de nouveau après un import. Les vidéos ne sont jamais incluses.'}</p>`
      +(S.dl?`<button class="btn" style="margin-top:12px" data-act="expsave">Télécharger le fichier</button>`:'')
      +`<button class="btn ghost" style="margin-top:10px" data-act="expcopy">Copier le texte</button>`
      +`<label class="fl" for="sf-exp">Contenu (JSON)</label><textarea id="sf-exp" rows="7" readonly style="font-size:12px">${esc(txt)}</textarea>`
      +`<div class="foot-actions"><button class="btn" style="flex:1" data-act="sheetclose">Fermer</button></div>`;},
  import(sh){ const f=sh.f;
    return shHead('Importer des données')+`<p class="muted">Choisissez un fichier JSON exporté depuis ce prototype, ou collez son contenu. <b>Les données actuelles seront remplacées.</b></p>`
      +`<button class="btn ghost" data-act="impfile">Choisir un fichier</button>`
      +`<label class="fl" for="sf-text">Ou collez le contenu ici</label><textarea id="sf-text" rows="7" data-sf="text" style="font-size:12px" placeholder="{ &quot;app&quot;: &quot;blvn-proto&quot; … }">${esc(f.text)}</textarea>${err('text')}`
      +shFoot('Importer');},
  contact(sh){ const f=sh.f;
    return shHead('Contacts pour les devis')+fld('Instagram','insta',f.insta,{ph:'blvn_braids',hint:'Sans le @.'})+fld('Snapchat','snap',f.snap,{ph:'identifiant',hint:'Sans le @. Affiché à côté d’Instagram.'})+shFoot('Enregistrer');},
  reply(sh){ const r=S.requests.find(x=>x.id==sh.rid), f=sh.f;

/* Instantané : les vidéos (adresses temporaires) ne sont jamais conservées ; les photos le sont sauf demande contraire */
function snapshot(withPhotos=true){
  const strip=o=>JSON.parse(JSON.stringify(o,(k,val)=>{
    if(typeof val==='string'){
      if(val.startsWith('blob:')) return null;
      if(!withPhotos&&val.startsWith('data:')) return null;
    }
    return val; }));
  return {app:'blvn-proto', v:1, savedAt:new Date().toISOString(),
    services:strip(SERVICES), categories:CATEGORIES.map(c=>({id:c.id,active:c.active})),
    cfg:{depositRate:CFG.depositRate,contact:{...CFG.contact}},
    gallery:strip(S.gallery), requests:strip(S.requests), wait:strip(S.wait), freed:[...S.freed], occupied:[...S.occupied],
    bookings:strip(S.bookings), points:S.points, reviews:strip(S.reviews)};
}
function applySnapshot(o){
  if(!(o&&o.app==='blvn-proto'&&o.v===1&&Array.isArray(o.services))) throw new Error('format');
  SERVICES.splice(0,SERVICES.length,...o.services.map(normalizeService));
  (o.categories||[]).forEach(c=>{ const x=CATEGORIES.find(k=>k.id===c.id); if(x&&c.id!=='coiffure') x.active=!!c.active; });
  if(o.cfg){ if(typeof o.cfg.depositRate==='number') CFG.depositRate=o.cfg.depositRate; Object.assign(CFG.contact,o.cfg.contact||{}); }
  S.gallery=(o.gallery||[]).map(normalizeGallery);
  S.requests=o.requests||[]; S.wait=o.wait||[]; S.freed=new Set(o.freed||[]); S.occupied=new Set(o.occupied||[]);
  S.bookings=o.bookings||[]; if(typeof o.points==='number') S.points=o.points; S.reviews=o.reviews||[];
  S.adm.svc=null; S.sheet=null; S.b=freshB(); S.step=1; S.done=null; S.waitFor=null; S.viewer=null; S.zoom='';
}

const MO = {px:0, py:0};
const scrollPos = () => window.scrollY || (document.documentElement&&document.documentElement.scrollTop) || (document.body&&document.body.scrollTop) || 0;

/* Scène 3D : un tunnel d’arches fines (le motif de la marque). Elles encadrent le contenu, puis la caméra avance quand on fait défiler la page. */
function initGL(){
  if(RM||!window.THREE) return;
  const cv=$('#gl'); if(!cv) return;
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true,powerPreference:'low-power'}); }catch(e){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const bg=new THREE.Color(getComputedStyle(document.body).backgroundColor||'rgb(255,90,95)');
  const scene=new THREE.Scene();
  scene.fog=new THREE.Fog(bg,6,27);
  const FOV=55, tanH=Math.tan(FOV*Math.PI/360);
  const cam=new THREE.PerspectiveCamera(FOV,1,0.1,60);
  const N=18, GAP=2.4, W=1.25, H=6, T=0.07, D=0.07, D0=5.8;
  const shape=new THREE.Shape();
  shape.moveTo(-W,-H); shape.lineTo(-W,0); shape.absarc(0,0,W,Math.PI,0,true); shape.lineTo(W,-H);
  shape.lineTo(W-T,-H); shape.lineTo(W-T,0); shape.absarc(0,0,W-T,0,Math.PI,false); shape.lineTo(-W+T,-H); shape.lineTo(-W,-H);
  const geo=new THREE.ExtrudeGeometry(shape,{depth:D,bevelEnabled:false,curveSegments:72});
  const mat=new THREE.MeshBasicMaterial({color:0xFAFAFA,fog:true,transparent:true,opacity:.95});
  const group=new THREE.Group(); scene.add(group);
  const arches=[];
  for(let i=0;i<N;i++){ const m=new THREE.Mesh(geo,mat); m.position.z=-i*GAP; group.add(m); arches.push(m); }
  // poussière lumineuse ronde : donne de la profondeur sans formes décoratives
  const cvs=document.createElement('canvas'); cvs.width=cvs.height=64; const cx2=cvs.getContext('2d');
  const gr=cx2.createRadialGradient(32,32,0,32,32,30); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.45,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  cx2.fillStyle=gr; cx2.fillRect(0,0,64,64);
  const cnt=110, pos=new Float32Array(cnt*3);
  for(let i=0;i<cnt;i++){ pos[i*3]=(Math.random()-.5)*7; pos[i*3+1]=(Math.random()-.5)*8; pos[i*3+2]=5-Math.random()*(N*GAP+4); }
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(pg,new THREE.PointsMaterial({map:new THREE.CanvasTexture(cvs),size:.2,transparent:true,opacity:.8,depthWrite:false,fog:true}));
  scene.add(pts);

  let w=0,h=0,sc=1,cz=D0,cx=0,cy=0;
  const resize=()=>{ w=cv.clientWidth; h=cv.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
    const a=w/h, wvis=2*D0*tanH*a, hvis=2*D0*tanH;
    sc=Math.max(.8,Math.min(1.7,(.92*wvis)/(2*W)));
    group.scale.setScalar(sc);
    group.position.y=(.5-.08)*hvis-W*sc;     // sommet de l’arche à 8 % du haut de l’écran
    pts.scale.setScalar(sc); };
  window.addEventListener('resize',resize); resize();
  window.addEventListener('pointermove',e=>{ MO.px=(e.clientX/window.innerWidth-.5)*2; MO.py=(.5-e.clientY/window.innerHeight)*2; },{passive:true});

  const frame=ts=>{
    requestAnimationFrame(frame);
    const on=S.view==='home'&&!document.hidden;
    cv.style.opacity=on?'1':'0';
    if(!on) return;
    if(cv.clientWidth!==w||cv.clientHeight!==h) resize();
    const t=ts/1000;
    const max=Math.max(1,document.documentElement.scrollHeight-window.innerHeight);
    const p=Math.min(1,Math.max(0,scrollPos()/max));
    const tz=D0-p*(N-5)*GAP*sc;
    cz+=(tz-cz)*.07; cx+=((MO.px*.5+Math.sin(t*.22)*.2)-cx)*.05; cy+=((MO.py*.28+Math.cos(t*.18)*.08)-cy)*.05;
    cam.position.set(cx,cy,cz); cam.lookAt(cx*.4,cy,cz-9);
    arches.forEach((m,i)=>{ m.rotation.z=Math.sin(t*.3+i*.55)*.035; });
    pts.rotation.y=t*.012;
    renderer.render(scene,cam);
    const l=document.querySelector('.hero-logo'); if(l&&p<.5) l.style.transform=`perspective(800px) rotateY(${MO.px*7}deg) rotateX(${MO.py*5}deg) translateY(${-scrollPos()*.14}px)`;
  };
  requestAnimationFrame(frame);
}

/* Carrousel 3D des prestations */
function setupCF(){

      el.style.opacity=String(1-Math.min(a*.3,.62)); el.classList.toggle('on',a<.35); }); };

/* Anneau 3D de la galerie : on le fait tourner avec le doigt, il tourne seul doucement */
function setupRing(){
  const ring=$('#ring'); if(!ring||!ring.querySelector) return;
  const inner=ring.querySelector('.ring-in'), items=[...inner.children], n=items.length; if(!n) return;
  const wd=items[0].offsetWidth||150, R=Math.round((wd/2+10)/Math.tan(Math.PI/n));
  items.forEach((el,i)=>{ el.style.transform=`rotateY(${i*360/n}deg) translateZ(${R}px)`; });
  let ang=S.ringAng||0, vel=0, drag=false, lx=0, moved=0;
  const apply=()=>{ inner.style.transform=`translateZ(${-R}px) rotateY(${ang}deg)`; S.ringAng=ang; };
  apply();
  ring.addEventListener('pointerdown',e=>{ drag=true; lx=e.clientX; moved=0; vel=0; });
  window.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-lx; lx=e.clientX; moved+=Math.abs(dx); ang+=dx*.45; vel=dx*.45; },{passive:true});
  window.addEventListener('pointerup',()=>{ drag=false; });
  ring.addEventListener('click',e=>{ if(moved>6){ e.stopPropagation(); e.preventDefault(); moved=0; } },true);
  const loop=()=>{ if(!ring.isConnected) return; if(!drag){ ang+=vel; vel*=.94; if(Math.abs(vel)<.05&&!RM) ang+=.16; } apply(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

/* Apparition au défilement (une seule fois par écran, jamais à chaque saisie) */
function setupReveal(changed){
  const els=[...document.querySelectorAll('#app .rv')]; if(!els.length) return;
  if(!changed||RM||!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }),{threshold:.1,rootMargin:'0px 0px -5% 0px'});
  els.forEach((e,i)=>{ e.style.transitionDelay=(i%3)*70+'ms'; io.observe(e); });
}

  sheetsave(){

          price:(f.kind==='number'||f.kind==='yesno')&&f.price!==''?+f.price:null,unit:f.kind==='number'?f.unit.trim():'',min:f.kind==='number'?f.min:'',max:f.kind==='number'?f.max:'',ph:f.kind==='text'?f.ph.trim():''}); if(!hasItems(g.kind)) g.items.forEach(x=>{x.unit=''}); if(g.kind==='single') g.items.forEach(x=>{x.unit=''}); };
        if(sh.gid){ const g=s.groups.find(x=>x.id===sh.gid); set(g); const n=cleanConds(s); msg=n?'Choix enregistré (une condition a été retirée)':'Choix enregistré'; break; }

    v.onloadeddata=()=>{ try{ v.currentTime=Math.min(.5,(v.duration||1)/2); }catch(e){ fin(null); } };
    v.onseeked=()=>{ try{ const c=document.createElement('canvas'); const k=Math.min(1,640/(v.videoWidth||640)); c.width=Math.round((v.videoWidth||640)*k); c.height=Math.round((v.videoHeight||360)*k); c.getContext('2d').drawImage(v,0,0,c.width,c.height); fin(c.toDataURL('image/jpeg',.8)); }catch(e){ fin(null); } };
    v.onerror=()=>fin(null); setTimeout(()=>fin(null),4000); v.src=src; }catch(e){ res(null); } });
}
